<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>多 Agent 编排 · 组织智能运行时</title>
<style>
:root{--bg:#050810;--panel:#0c1220;--line:#1a2540;--cyan:#22d3ee;--mint:#34d399;--amber:#fbbf24;--t1:#f4f7fb;--t2:#9fb0c7;--t3:#5c6b84}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:18px}h1{font-size:24px}h2{font-size:16px}h3{font-size:14px}.sub,.meta{color:var(--t2);font-size:12px}.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.runtime-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.runtime{border:1px solid var(--line);border-radius:9px;padding:10px}.ready{color:var(--mint)}.warn,.error{color:var(--amber)}.notice{color:var(--mint)}label{display:block;margin-top:10px;color:var(--t2);font-size:12px}input,select,textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--t1);padding:10px;font:inherit}textarea{min-height:90px;resize:vertical}button,a.btn{min-height:42px;border:1px solid var(--cyan);border-radius:8px;background:var(--cyan);color:#04121a;padding:9px 13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;margin-top:10px}button.secondary,a.btn{border-color:var(--line);background:transparent;color:var(--cyan)}button.danger{border-color:var(--amber);background:transparent;color:var(--amber)}button:disabled{opacity:.4;cursor:not-allowed}.plans{display:flex;gap:8px;flex-wrap:wrap}.plan-chip{border-color:var(--line);background:transparent;color:var(--t2)}.plan-chip.on{border-color:var(--cyan);color:var(--cyan)}.role{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}.candidate{border-top:1px solid var(--line);padding:8px 0}.result{white-space:pre-wrap;max-height:240px;overflow:auto;background:var(--bg);padding:10px;border-radius:8px;font-size:12px}.hash{word-break:break-all;font:10px monospace;color:var(--t3)}.actions{display:flex;gap:8px;flex-wrap:wrap}.events{max-height:260px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:var(--cyan);text-decoration:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.runtime-grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){main{padding:12px}.runtime-grid{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><div><h1>多 Agent 自然语言编排</h1><div class="sub">本地组织智能运行时桌面端 · canonical 事件驱动竞岗 · 独立验收后原工资链结算</div></div><a href="index.html">返回组织总览</a></div>
<div id="error" class="error" role="alert"></div><div id="notice" class="notice" role="status"></div>
<section class="grid"><div class="card"><h2>① 一句话生成岗位计划</h2><label>工作部门<select id="dept"></select></label><label>自然语言任务<textarea id="instruction" placeholder="例如：巡检、报告、复核三个岗位并行完成本周产线检查，各自提交证据，由另一负责人验收。"></textarea></label><label>每岗位验收工资（job_token）<input id="reward" type="number" min="1" value="1"></label><p class="meta">规划模型不决定工资；创建计划不会直接执行或扣款。</p><button id="create">生成岗位计划</button></div>
<div class="card"><h2>② runtime 大容器与竞岗身份</h2><div id="runtimes" class="runtime-grid"></div><div class="grid"><label>绑定 runtime<select id="bind-runtime"><option>dsh</option><option>kimi</option><option>glm</option><option>workbuddy</option><option>qwen</option></select></label><label>本人已达标 Agent<select id="registration"><option value="0">请选择</option></select></label></div><button id="bind" class="secondary">绑定竞岗身份</button></div></section>
<section class="card"><h2>③ 编排计划</h2><div id="plans" class="plans"></div><div id="selected"><p class="meta">选择一份计划查看，或先创建。</p></div></section>
<section class="card"><h2>事件边界</h2><p class="meta">publishJob → applyJob → 独立录用 → publishTask → claimTask → 事件执行 → submitTask → 独立验收。执行不等于交付，awaiting_review 不结算工资；既有插件与订阅插件包体系不变。</p></section>
</main><script src="org-boot.js"></script><script>
(()=>{
const $=id=>document.getElementById(id);let departmentId='',selected=null,busy=false,createKey='',plans=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=s=>({planned:'待竞岗',awaiting_selection:'竞岗中',ready_to_dispatch:'待派发',running:'执行中',awaiting_review:'待验收',completed:'已完成',cancelled:'已撤销',selected:'已录用',claimed:'已领取',executing:'执行中',accepted:'已验收',rejected:'已驳回',applied:'待录用',blocked:'已阻断',failed:'失败',attention_required:'需处理'}[s]||s);
function feedback(error,notice){$('error').textContent=error?orgPublicErrorText(error):'';$('notice').textContent=notice||''}
async function api(path,input={}){return apiRaw(path,input)}
async function loadRuntimes(){if(!departmentId)return;const data=await api('agentRuntime.runtimes',{departmentId});$('runtimes').innerHTML=data.runtimes.map(r=>`<article class="runtime"><strong>${esc(r.name)}</strong><p class="${r.ready?'ready':'warn'}">${r.ready?'适配器已接通':'未接通'}</p><p class="meta">${esc(r.detail)}</p><p class="meta">竞岗身份：${r.identity?`#${r.identity.registrationId} ${esc(r.identity.registrationStatus)}`:'未绑定'}</p></article>`).join('')}
async function loadPlans(){plans=await api('agentRuntime.list',{});$('plans').innerHTML=plans.map(p=>`<button class="plan-chip ${selected?.plan.id===p.plan.id?'on':''}" data-plan="${p.plan.id}">${esc(p.plan.planNo)} · ${esc(status(p.plan.status))}</button>`).join('')||'<span class="meta">尚无编排计划</span>'}
async function init(){try{const [identity,factory,mine]=await Promise.all([api('agentWork.identity'),api('agentWork.factory'),api('agentTraining.mine')]);if(!['admin','manager'].includes(identity.orgRole))throw new Error('仅企业负责人或部门负责人可使用多 Agent 编排');$('dept').innerHTML=factory.departments.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('');departmentId=identity.departmentId&&factory.departments.some(d=>d.id===identity.departmentId)?identity.departmentId:factory.departments[0]?.id||'';$('dept').value=departmentId;$('registration').innerHTML='<option value="0">请选择本人已达标 Agent</option>'+mine.qualifiedRegistrations.map(r=>`<option value="${r.id}">#${r.id} · ${esc(r.agentName)}</option>`).join('');await Promise.all([loadRuntimes(),loadPlans()]);feedback(null,'')}catch(error){feedback(error,'')}}
async function action(path,input,success){if(busy)return;busy=true;feedback(null,'');try{selected=await api(path,input);renderSelected();await loadPlans();feedback(null,success)}catch(error){feedback(error,'')}finally{busy=false}}
function renderSelected(){if(!selected){$('selected').innerHTML='<p class="meta">选择一份计划查看，或先创建。</p>';return}const p=selected;$('selected').innerHTML=`<article class="role"><h3>${esc(p.plan.planNo)} · ${esc(status(p.plan.status))}</h3><p>${esc(p.plan.naturalLanguage)}</p>${p.plan.planner?`<p class="hash">${esc(p.plan.planner.provider)} · ${esc(p.plan.planner.model)} · ${esc(p.plan.planner.requestSha256)}</p>`:''}<div class="actions">${p.plan.status==='planned'?'<button data-action="compete">发起竞岗</button>':''}${p.roles.some(r=>r.status==='selected')?'<button data-action="dispatch">领取任务并并行执行</button>':''}${!['completed','cancelled','awaiting_review'].includes(p.plan.status)?'<button class="danger" data-action="cancel">撤销未交付计划</button>':''}</div></article>${p.roles.map(role=>`<article class="role"><h3>${esc(role.role)} · ${esc(role.title)} · ${esc(status(role.status))}</h3><p class="meta">${esc(role.brief)}</p><p class="meta">奖励 ${role.rewardJobTokens} job_token · 执行 ${esc(role.assignedRuntime||'待录用')} · 工资 ${role.wageSettled?'已结算':'未结算'}</p>${p.candidates.filter(c=>c.roleId===role.id).map(c=>`<div class="candidate"><span class="meta">${esc(c.runtime)} · Agent #${c.registrationId} · ${esc(status(c.status))}${c.errorCode?' · '+esc(c.errorCode):''}</span>${c.status==='applied'?`<button class="secondary" data-select="${c.id}">独立录用</button>`:''}</div>`).join('')}${role.result?`<details><summary>查看执行交付与证据</summary><div class="result">${esc(role.result)}</div><p class="hash">SHA-256 ${esc(role.resultSha256)}</p></details>`:''}${role.status==='awaiting_review'?`<div class="role"><p class="warn">已提交但未验收，当前不会发工资。</p><textarea id="review-${role.id}">独立复核：交付物、证据与岗位要求一致。</textarea><div class="actions"><button data-review="accept" data-role="${role.id}">验收并按交付发薪</button><button class="danger" data-review="reject" data-role="${role.id}">驳回不发薪</button></div></div>`:''}</article>`).join('')}<article class="role"><h3>canonical outbox</h3>${p.outbox.map(e=>`<p class="meta">#${e.id} · ${esc(e.eventType)} · ${esc(e.status)} · 尝试 ${e.attemptCount}/${e.maxAttempts}${e.lastError?' · '+esc(e.lastError):''}</p>`).join('')}</article>`}
$('dept').addEventListener('change',async e=>{departmentId=e.target.value;await loadRuntimes().catch(feedback)});$('instruction').addEventListener('input',()=>{createKey=''});$('create').addEventListener('click',()=>{const instruction=$('instruction').value.trim(),rewardJobTokens=Number($('reward').value);if(instruction.length<4||rewardJobTokens<1||!departmentId)return feedback(new Error('请填写部门、自然语言任务和有效工资'),'');createKey ||= crypto.randomUUID();void action('agentRuntime.createPlan',{departmentId,idempotencyKey:createKey,rewardJobTokens,instruction},'SCNet 真实规划已落库，请核对后发起竞岗。')});$('bind').addEventListener('click',async()=>{const registrationId=Number($('registration').value),runtime=$('bind-runtime').value;if(!registrationId)return feedback(new Error('请选择本人已达标 Agent'),'');busy=true;try{await api('agentRuntime.bindIdentity',{departmentId,runtime,registrationId});await loadRuntimes();feedback(null,'runtime 竞岗身份已绑定')}catch(error){feedback(error,'')}finally{busy=false}});$('plans').addEventListener('click',async e=>{const id=e.target.closest('[data-plan]')?.dataset.plan;if(!id)return;try{selected=await api('agentRuntime.plan',{planId:Number(id)});renderSelected();await loadPlans()}catch(error){feedback(error,'')}});$('selected').addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='compete')return void action('agentRuntime.openCompetition',{planId:selected.plan.id},'岗位与候选应聘已落库，请由另一负责人录用。');if(a==='dispatch')return void action('agentRuntime.dispatch',{planId:selected.plan.id},'canonical outbox 正驱动并行执行。');if(a==='cancel')return void action('agentRuntime.cancel',{planId:selected.plan.id,reason:'企业负责人撤销未交付编排'},'计划与未交付任务已撤销。');const candidate=e.target.closest('[data-select]')?.dataset.select;if(candidate)return void action('agentRuntime.selectCandidate',{candidateId:Number(candidate)},'候选人已由独立负责人录用。');const verdict=e.target.closest('[data-review]')?.dataset.review,roleId=e.target.closest('[data-role]')?.dataset.role;if(verdict&&roleId){const note=$(`review-${roleId}`).value.trim();if(note.length<4)return feedback(new Error('请填写独立复核意见'),'');return void action('agentRuntime.review',{roleId:Number(roleId),verdict,note},verdict==='accept'?'独立验收通过，原工资链已按实际交付结算。':'交付已驳回，未结算工资。')}});setInterval(async()=>{if(!selected||selected.plan.status!=='running'||busy)return;try{selected=await api('agentRuntime.plan',{planId:selected.plan.id});renderSelected()}catch{/* 下轮重读 */}},2000);void init();
})();
</script></body></html>
